<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0259BC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AfriCare">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<title>AfriCare</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Work+Sans:wght@400;600;700&display=swap');
:root{--blue:#0259BC;--green:#0BA251;--ochre:#E08E45;--red:#C0392B;--sand:#FAF3E7;--ink:#16202A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sand);font-family:'Work Sans',system-ui,sans-serif;color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#0259BC,#0BA251);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.5s}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:120px;height:120px;position:relative}
.pulse{position:absolute;inset:-10px;border:3px solid rgba(255,255,255,.5);border-radius:50%;animation:p 1.1s infinite}
@keyframes p{50%{transform:scale(1.12);opacity:1}}
.splash-text{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;color:#fff;margin-top:16px}
.top{background:var(--blue);color:#fff;padding:12px;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px}
.roles{display:flex;background:#fff;border-bottom:1px solid #e5ddc9}
.roles button{flex:1;border:none;background:none;padding:12px;font-weight:600;color:#8a8071;border-bottom:3px solid transparent}
.roles button.on{color:var(--blue);border-bottom-color:var(--blue)}
.body{flex:1;overflow:auto;padding:14px}
.card{background:#fff;border:1.5px solid #e3dccb;border-radius:14px;padding:14px;margin-bottom:10px}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:#fff;background:var(--ochre);margin-top:8px;cursor:pointer}
.btn.green{background:var(--green)}
.btn.outline{background:none;border:2px dashed var(--blue);color:var(--blue)}
.btn.outline.green{border-color:var(--green);color:var(--green);background:#E2EFDA}
.note{font-size:12px;color:#6b6152;text-align:center;margin-top:10px}
.footer{text-align:center;font-size:11px;color:#8a8071;padding:8px;background:#fff;border-top:1px solid #e5ddc9}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-logo"><div class="pulse"></div>
    <svg viewBox="0 0 120 120" width="120" height="120"><path d="M22 78 Q16 40 38 28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="22" cy="80" r="5" fill="#0BA251"/><circle cx="38" cy="28" r="5" fill="#fff"/><path d="M48 32 C54 24 68 22 78 30 C88 24 100 32 104 44 C108 56 104 74 94 86 C84 98 66 102 54 94 C44 100 34 88 32 72 C28 56 36 40 48 32 Z" stroke="#0BA251" stroke-width="4" fill="none"/><rect x="68" y="48" width="12" height="28" rx="2" fill="#fff"/><rect x="60" y="56" width="28" height="12" rx="2" fill="#fff"/></svg>
  </div>
  <div class="splash-text">AfriCare</div>
  <div style="color:rgba(255,255,255,.85);font-size:13px;margin-top:4px">La santé, sans attendre.</div>
</div>
<div id="app" style="visibility:hidden">
  <div class="top">AfriCare</div>
  <div class="roles">
    <button class="on" data-r="patient">Patient</button>
    <button data-r="pro">Professionnel</button>
    <button data-r="accueil">Accueil</button>
  </div>
  <div class="body" id="body"></div>
  <div class="footer">AfriCare · Confidentiel · Test Dakar</div>
</div>
<script src="notifications.js"></script>
<script>
setTimeout(function(){
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').style.visibility='visible';
  if('Notification' in window && Notification.permission==='default'){
    /* permission will be asked on button */
  }
},1600);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(r){r.update()}).catch(function(){});
}
var role='patient';
document.querySelector('.roles').onclick=function(e){
  var b=e.target.closest('[data-r]'); if(!b)return;
  role=b.dataset.r;
  document.querySelectorAll('.roles button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');
  render();
};
function render(){
  var el=document.getElementById('body');
  if(role==='patient'){
    el.innerHTML='<div class="card"><b>Mes tickets — suivi file</b><p style="font-size:13px;color:#8a8071;margin:8px 0">Ticket <b style="color:#0259BC;font-size:22px">A124</b><br>1 patient devant vous · ~12 min</p></div>'+
      '<button class="btn outline green" id="realNotif">📲 Envoyer une vraie notification</button>'+
      '<button class="btn outline" id="askPerm">🔔 Autoriser les notifications</button>'+
      '<p class="note">Après autorisation, verrouille ton téléphone : la notification système peut apparaître.</p>';
    document.getElementById('realNotif').onclick=async function(){
      if(window.AfriCareNotif){
        await AfriCareNotif.show('AfriCare','Ticket A124 · 1 devant vous · 12 min — Bientôt votre tour','soon');
      } else if(Notification.permission==='granted'){
        new Notification('AfriCare',{body:'Ticket A124 · 1 devant vous · 12 min',tag:'africare-queue'});
      } else {
        alert('Appuie d\'abord sur « Autoriser les notifications »');
      }
    };
    document.getElementById('askPerm').onclick=async function(){
      if(!('Notification' in window)){alert('Non supporté');return}
      var p=await Notification.requestPermission();
      alert(p==='granted'?'Notifications autorisées ✓':'Permission refusée — active-les dans Réglages');
    };
  } else if(role==='pro'){
    el.innerHTML='<div class="card"><b>Espace professionnel</b><p style="font-size:13px;margin-top:8px;color:#8a8071">Dr. Diop — Cardiologie</p></div><button class="btn green">✔ Suivant</button>';
  } else {
    el.innerHTML='<div class="card"><b>Accueil — Clinique AfriCare</b><p style="font-size:13px;margin-top:8px;color:#8a8071">Vue multi-services</p></div>';
  }
}
render();
</script>
</body>
</html>
